<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1 id="titulo">Lista de Tarefas</h1>

        <form id="form-tarefa">

            <label for="input-tarefa">
                Nova tarefa
            </label>

            <input
                type="text"
                id="input-tarefa"
                placeholder="Digite uma tarefa"
            >

            <button type="submit" id="btn-adicionar">
                Adicionar
            </button>

        </form>

        <section>

            <h2>Minhas tarefas</h2>

            <ul data-list>
                <!-- As tarefas serão criadas pelo JavaScript -->
            </ul>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
